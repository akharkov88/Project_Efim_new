    async function getCompanyList(id_company = '', page = 1, size = 5) {

            tempBut.textContent = '+';

                        })
                    tempBut.textContent = '-';

                    if($('.pasteObjectTr')[0]){

                    console.log('дергаю запрос, передаю ',tempBut.parentElement.parentElement.childNodes[searchIndexId].innerText)

        if (document.getElementById('pagination')==null) {

                {#console.log('тут', i)#}

            paginationBut(arrayCustomers[arrayCustomers.length - 1].size, arrayCustomers[arrayCustomers.length - 1].total)

    function paginationBut(itemsPerPage, totalPages) {
        const content = document.querySelector('.content');
        {#const itemsPerPage = 5;#}
        let currentPage = 1;
        const items = Array.from(content.getElementsByTagName('tr')).slice(1);

        function showPage(page) {
            console.log('PAGE', page)
            getCompanyList('', page, itemsPerPage)

            /*const startIndex = page * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            items.forEach((item, index) => {
                item.classList.toggle('hidden', index < startIndex || index >= endIndex);
            })*/
            updateActiveButtonStates();
        }

        function createPageButtons() {
            {#const totalPages = Math.ceil(items.length / itemsPerPage);#}
            const paginationContainer = document.createElement('div');
            const paginationDiv = document.body.appendChild(paginationContainer);
            paginationContainer.classList.add('pagination');
            paginationContainer.setAttribute('id', 'pagination');

            // Add page buttons
            for (let i = 1; i < totalPages + 1; i++) {
                const pageButton = document.createElement('button');
                pageButton.textContent = i;
                pageButton.addEventListener('click', () => {
                    currentPage = i;
                    showPage(currentPage);
                    updateActiveButtonStates();
                });

                content.appendChild(paginationContainer);
                paginationDiv.appendChild(pageButton);
            }
        }

        function updateActiveButtonStates() {
            const pageButtons = document.querySelectorAll('.pagination button');
            pageButtons.forEach((button, index) => {
                if (index + 1 === currentPage) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }
        createPageButtons(); // Call this function to create the page buttons initially
        showPage(currentPage);
    }
